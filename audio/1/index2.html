<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Ascolto — Lo butto oggi o lo butto domani?</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1e1d1a;
      --muted: #6a675f;
      --card: #ffffff;
      --line: #e3dfd5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px 24px;
    }
    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    h1 {
      font-size: 26px;
      line-height: 1.2;
      margin: 0 0 12px;
    }
    p { margin: 0 0 16px; }
    audio {
      width: 100%;
      display: block;
      margin: 8px 0 20px;
    }
    .note {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Traccia 2</p>
    <h1>Lo butto oggi o lo butto domani?</h1>
    <p>Premi play per ascoltare. Puoi riascoltare quante volte vuoi.</p>

    <audio controls preload="metadata" src="traccia2.mp3">
      Il tuo browser non supporta la riproduzione audio.
      <a href="traccia2.mp3">Scarica il file</a>.
    </audio>

    <p class="note">Se non senti nulla, controlla il volume e che il telefono non sia in modalità silenziosa.</p>
  </main>
</body>
</html>
